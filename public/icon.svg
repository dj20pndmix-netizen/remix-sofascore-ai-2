<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1f18"/>
      <stop offset="100%" stop-color="#040b08"/>
    </linearGradient>

    <!-- Shield Glow Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Cyan Neon Accent -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Pitch Lines in Background -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.15"/>
  <line x1="256" y1="40" x2="256" y2="472" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.12"/>
  <line x1="40" y1="256" x2="472" y2="256" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.12"/>

  <!-- Glowing Outer Shield -->
  <path d="M 256 68 L 396 116 C 396 260 336 380 256 444 C 176 380 116 260 116 116 Z" 
        fill="#061811" 
        stroke="url(#shieldGrad)" 
        stroke-width="8" 
        filter="url(#glow)" />

  <!-- Inner Shield Layer -->
  <path d="M 256 92 L 372 132 C 372 250 320 354 256 412 C 192 354 140 250 140 132 Z" 
        fill="#0a2318" 
        stroke="#10b981" 
        stroke-width="3" 
        stroke-opacity="0.6" />

  <!-- Shield Core Shading -->
  <path d="M 256 92 L 372 132 C 372 250 320 354 256 412 Z" 
        fill="#10b981" 
        fill-opacity="0.08" />

  <!-- Center Football Icon with AI Neural Hexagons -->
  <g transform="translate(256, 230)">
    <!-- Ball Glow -->
    <circle cx="0" cy="0" r="74" fill="#03100a" stroke="url(#shieldGrad)" stroke-width="6" filter="url(#subtleGlow)"/>

    <!-- Football Pentagons & Seams -->
    <!-- Center Pentagon -->
    <polygon points="0,-26 25,-8 15,22 -15,22 -25,-8" fill="url(#shieldGrad)"/>

    <!-- Top Left Outer Pentagon -->
    <polygon points="-46,-40 -26,-24 -36,0 -60,0 -54,-28" fill="#1e293b"/>
    <!-- Top Right Outer Pentagon -->
    <polygon points="46,-40 54,-28 60,0 36,0 26,-24" fill="#1e293b"/>
    <!-- Bottom Outer Pentagon -->
    <polygon points="0,62 -22,46 -12,24 12,24 22,46" fill="#1e293b"/>

    <!-- Connecting Seam Lines -->
    <line x1="0" y1="-26" x2="0" y2="-66" stroke="#10b981" stroke-width="3"/>
    <line x1="25" y1="-8" x2="60" y2="-20" stroke="#10b981" stroke-width="3"/>
    <line x1="15" y1="22" x2="48" y2="48" stroke="#10b981" stroke-width="3"/>
    <line x1="-15" y1="22" x2="-48" y2="48" stroke="#10b981" stroke-width="3"/>
    <line x1="-25" y1="-8" x2="-60" y2="-20" stroke="#10b981" stroke-width="3"/>
  </g>

  <!-- AI Brain / Sparkle Crown on Top of Ball -->
  <path d="M 256 128 L 264 148 L 284 156 L 264 164 L 256 184 L 248 164 L 228 156 L 248 148 Z" 
        fill="url(#goldGrad)" 
        filter="url(#subtleGlow)"/>

  <circle cx="216" cy="146" r="4" fill="#fbbf24"/>
  <circle cx="296" cy="146" r="4" fill="#fbbf24"/>

  <!-- PREDICT PRO Typography at Bottom of Shield -->
  <text x="256" y="348" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="3" 
        text-anchor="middle" 
        fill="#ffffff">PREDICT<tspan fill="#10b981">PRO</tspan></text>

  <!-- Sub-label AI -->
  <rect x="216" y="366" width="80" height="20" rx="10" fill="url(#goldGrad)"/>
  <text x="256" y="380" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="12" 
        font-weight="900" 
        letter-spacing="2" 
        text-anchor="middle" 
        fill="#0f172a">SOFASCORE AI</text>
</svg>
